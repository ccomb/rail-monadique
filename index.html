<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Animation interactive des monades Maybe, Either, List, Reader, Writer, State, IO et Parser, en Haskell et en Elm.">
<title>Le rail monadique</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; }

/* Layout : une scène animée (rail / boîtes) à côté du code Haskell qui s'allume en même temps */
:root {
  --bg: #F2F0F6;
  --surface: #FFFFFF;
  --ink: #1D1A2B;
  --muted: #6A6480;
  --line: #D3CDE0;
  --accent: #5E5086;
  --on-accent: #FFFFFF;
  --layer: rgba(94, 80, 134, 0.08);
  --ok: #2E7A58;
  --warn: #B86B0A;
  --warn-soft: rgba(184, 107, 10, 0.12);
  --hl: rgba(94, 80, 134, 0.12);
  --f-display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --f-body: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --f-code: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14121B; --surface: #1E1B29; --ink: #ECE9F5; --muted: #9D97B2; --line: #363049;
    --accent: #A998E3; --on-accent: #17141F; --layer: rgba(169, 152, 227, 0.10);
    --ok: #5CC596; --warn: #F0A84A; --warn-soft: rgba(240, 168, 74, 0.14); --hl: rgba(169, 152, 227, 0.16);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #14121B; --surface: #1E1B29; --ink: #ECE9F5; --muted: #9D97B2; --line: #363049;
  --accent: #A998E3; --on-accent: #17141F; --layer: rgba(169, 152, 227, 0.10);
  --ok: #5CC596; --warn: #F0A84A; --warn-soft: rgba(240, 168, 74, 0.14); --hl: rgba(169, 152, 227, 0.16);
  color-scheme: dark;
}

[hidden] { display: none !important; }
code, pre, pre *, svg text, .typeline, .typeline *, .seg button, .tab code, .caption code, .note { font-variant-ligatures: none !important; font-feature-settings: "liga" 0, "calt" 0, "dlig" 0 !important; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.5; }
.wrap { max-width: 1040px; margin: 0 auto; padding-inline: 20px; padding-block: 28px 48px; display: flex; flex-direction: column; gap: 20px; }

header { display: flex; flex-direction: column; gap: 6px; }
h1 { font-family: var(--f-display); font-stretch: 112%; font-weight: 800; font-size: clamp(1.9rem, 5vw, 2.8rem); line-height: 1.05; margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
h1 code { font-family: var(--f-code); font-weight: 600; font-size: 0.82em; color: var(--accent); }
.lede { margin: 0; color: var(--muted); max-width: 62ch; }

.picker { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
.picker .lab { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .08em; }
.seg.big { flex-wrap: wrap; }
.blurb { flex-basis: 100%; margin: 0; font-size: 15px; max-width: 70ch; }
.blurb code { font-family: var(--f-code); font-size: .9em; color: var(--accent); }
.seg.big button { font-size: 15px; padding: 11px 16px; }
@media (max-width: 480px) { .seg.big button { font-size: 13.5px; padding: 10px 9px; } }
.tab code { font-family: var(--f-code); font-size: 13.5px; }
.tabdesc { margin: -8px 0 0; font-size: 15px; max-width: 70ch; }
.tabdesc code { font-family: var(--f-code); font-size: .9em; color: var(--accent); }
.codehead { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px; min-height: 34px; }
.badge { font-size: 12px; color: var(--warn); border: 1px solid var(--warn); border-radius: 999px; padding: 3px 9px; }
.syn { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.controls { max-width: 560px; }
.tabs { display: flex; flex-wrap: wrap; gap: 8px; }
.tab { font: 600 14px/1 var(--f-body); font-stretch: 90%; padding: 10px 14px; border-radius: 999px; border: 1px solid var(--line); background: transparent; color: var(--ink); cursor: pointer; display: flex; gap: 8px; align-items: center; }
.tab .n { font-family: var(--f-code); color: var(--muted); }
.tab[aria-selected="true"] { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.tab[aria-selected="true"] .n { color: var(--on-accent); opacity: .75; }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.grid { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 760px) { .grid { grid-template-columns: minmax(0, 1fr); } }

.stagecol { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.typeline { font-family: var(--f-code); font-size: 14px; color: var(--accent); min-height: 1.5em; overflow-x: auto; white-space: nowrap; }
.typeline .k { color: var(--muted); }
svg#stage { width: 100%; height: auto; display: block; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
svg text { font-family: var(--f-code); }

.caption { margin: 0; min-height: 3em; max-width: 60ch; }
.caption code { font-family: var(--f-code); font-size: .9em; color: var(--accent); }

.controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.ctl { font: 600 14px/1 var(--f-body); padding: 10px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; }
.ctl.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); min-width: 92px; }
.ctl:disabled { opacity: .35; cursor: default; }
.dots { display: flex; gap: 6px; margin-left: auto; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--line); }
.dot.on { background: var(--accent); }

.opts { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; font-size: 14px; }
.opts[hidden] { display: none !important; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { font: 600 13px/1 var(--f-code); padding: 8px 12px; background: var(--surface); color: var(--ink); border: 0; cursor: pointer; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
.opts .lab { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .08em; }

.codecol { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.codecol .lab { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .08em; }
pre.code { margin: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 0; overflow-x: auto; font: 13.5px/1.7 var(--f-code); }
pre.code .ln { display: block; padding: 0 16px; border-left: 3px solid transparent; transition: background .3s, border-color .3s, opacity .3s; white-space: pre; min-height: 1.7em; }
pre.code .ln.hl { background: var(--hl); border-left-color: var(--accent); }
pre.code .ln.skip { opacity: .4; text-decoration: line-through; text-decoration-color: var(--warn); }
pre.code .ty { color: var(--accent); }
pre.code .cm { color: var(--muted); }
pre.code .kw { font-weight: 600; }
.note { font-size: 14px; color: var(--muted); margin: 0; }

/* scène */
.layer { fill: var(--layer); stroke: var(--accent); stroke-width: 1.5; }
.layer-lab { fill: var(--accent); font-size: 12px; font-weight: 600; }
.pill { fill: var(--surface); stroke: var(--ink); stroke-width: 1.5; }
.pill.nothing { stroke: var(--warn); fill: var(--warn-soft); }
.val { fill: var(--ink); font-size: 16px; font-weight: 600; }
.val.nothing { fill: var(--warn); }
.op { fill: var(--accent); font-size: 14px; font-weight: 600; }
.anim { transition: transform .75s cubic-bezier(.55, 0, .2, 1), opacity .5s; transform-box: fill-box; transform-origin: center; }
.fadein { animation: fadein .45s ease-out both; }
@keyframes fadein { from { opacity: 0; transform: scale(.94); } to { opacity: 1; transform: none; } }
.fadein { transform-box: fill-box; transform-origin: center; }

.rail { stroke: var(--muted); stroke-width: 2.5; }
.sleepers { stroke: var(--line); stroke-width: 12; stroke-dasharray: 2 9; }
.siding { stroke: var(--warn); stroke-width: 2.5; opacity: .55; }
.siding-sl { stroke: var(--warn); stroke-width: 12; stroke-dasharray: 2 9; opacity: .18; }
.muted { fill: var(--muted); font-size: 11px; font-family: var(--f-body); }
.station rect { fill: var(--surface); stroke: var(--line); stroke-width: 1.5; transition: stroke .3s; }
.station text { fill: var(--ink); font-size: 13px; font-weight: 600; }
.station .post { stroke: var(--line); stroke-width: 2; }
.station .light { fill: var(--line); transition: fill .3s; }
.station { transition: opacity .4s; }
.station.ok rect { stroke: var(--ok); } .station.ok .light { fill: var(--ok); }
.station.fail rect { stroke: var(--warn); } .station.fail .light { fill: var(--warn); }
.station.skip { opacity: .3; }
.wagon { transition: transform .8s cubic-bezier(.55, 0, .2, 1), opacity .5s; }
.wagon.tok rect { fill: var(--ok); }
.gate rect { fill: var(--layer); stroke: transparent; stroke-width: 1.5; transition: stroke .3s; }
.gate text { fill: var(--accent); font-size: 12px; font-weight: 600; }
.gate.on rect { stroke: var(--accent); }
.edge { fill: none; stroke: var(--muted); stroke-width: 2; stroke-linejoin: round; transition: opacity .5s; }
.bracket { fill: none; stroke: var(--accent); stroke-width: 2; transition: opacity .5s; }
.bracket-lab { fill: var(--accent); font-size: 12px; font-weight: 600; transition: opacity .5s; }
.read { fill: none; stroke: var(--accent); stroke-width: 2; stroke-dasharray: 4 4; transition: opacity .4s; }
.term { fill: var(--bg); stroke: var(--line); stroke-width: 1.5; }
.term-title { fill: var(--muted); font-size: 11px; font-family: var(--f-body); }
.term-line { fill: var(--ink); font-size: 13px; transition: opacity .4s; }
.term-line.in { fill: var(--accent); font-weight: 600; }
.cell rect { fill: var(--surface); stroke: var(--ink); stroke-width: 1.5; transition: fill .3s, stroke .3s; }
.cell text { fill: var(--ink); font-size: 16px; font-weight: 600; transition: fill .3s; }
.cell.used rect { fill: var(--layer); stroke: var(--line); }
.cell.used text { fill: var(--muted); }
.cell.bad rect { fill: var(--warn-soft); stroke: var(--warn); }
.cell.bad text { fill: var(--warn); }
.cursor { fill: var(--accent); transition: transform .6s cubic-bezier(.55, 0, .2, 1); }
.lane-lab { fill: var(--muted); font-size: 11px; font-family: var(--f-body); }
.wagon rect { fill: var(--accent); transition: fill .3s; }
.wagon text { fill: var(--on-accent); font-size: 13px; font-weight: 600; }
.wagon.fail rect { fill: var(--warn); }
.wagon .wheel { fill: var(--ink); }

@media (prefers-reduced-motion: reduce) {
  .anim, .wagon, .station, pre.code .ln { transition: none !important; }
  .fadein { animation: none; }
}
</style>

</head>
<body>
<div class="wrap">
  <header>
    <h1>Le rail monadique</h1>
    <p class="lede">Pourquoi <code style="font-family:var(--f-code);color:var(--accent)">&gt;&gt;=</code> existe, en trois temps, pour huit monades. Avec <code style="font-family:var(--f-code);color:var(--accent)">Maybe</code>, <code style="font-family:var(--f-code);color:var(--accent)">Either</code>, <code style="font-family:var(--f-code);color:var(--accent)">List</code>, <code style="font-family:var(--f-code);color:var(--accent)">Reader</code>, <code style="font-family:var(--f-code);color:var(--accent)">Writer</code>, <code style="font-family:var(--f-code);color:var(--accent)">State</code>, <code style="font-family:var(--f-code);color:var(--accent)">IO</code> ou <code style="font-family:var(--f-code);color:var(--accent)">Parser</code>, la mécanique est la même : seul le sens de « aplatir » change.</p>
  </header>

  <div class="picker">
    <span class="lab">Monade</span>
    <span class="seg big" id="kinds">
      <button data-k="maybe">Maybe</button><button data-k="either">Either</button><button data-k="list">List</button><button data-k="reader">Reader</button><button data-k="writer">Writer</button><button data-k="state">State</button><button data-k="io">IO</button><button data-k="parser">Parser</button>
    </span>
    <p class="blurb" id="blurb" aria-live="polite"></p>
  </div>

  <div class="tabs" role="tablist">
    <button class="tab" role="tab" data-act="0" id="tab0"><span class="n">1</span><code>fmap</code></button>
    <button class="tab" role="tab" data-act="1" id="tab1"><span class="n">2</span><code>join</code></button>
    <button class="tab" role="tab" data-act="2" id="tab2"><span class="n">3</span>Les deux enchaînés : <code>&gt;&gt;=</code></button>
  </div>
  <p class="tabdesc" id="tabdesc" aria-live="polite"></p>

  <div class="controls">
    <button class="ctl" id="prev" aria-label="Étape précédente">◀</button>
    <button class="ctl primary" id="play">▶ Lecture</button>
    <button class="ctl" id="next" aria-label="Étape suivante">▶</button>
    <div class="dots" id="dots"></div>
  </div>

  <div class="grid">
    <div class="stagecol">
      <div class="typeline" id="typeline"></div>
      <svg id="stage" viewBox="0 0 360 230" role="img" aria-label="Animation de la monade Maybe"></svg>
      <p class="caption" id="caption" aria-live="polite"></p>
      <div class="opts" id="opts" hidden>
        <span class="lab" id="inputLab">Entrée</span>
        <span class="seg" id="pinputs" hidden>
          <button data-p="12+30">"12+30"</button><button data-p="12-30">"12-30"</button>
        </span>
        <span class="seg" id="inputs">
          <button data-v="8">8</button><button data-v="6">6</button><button data-v="20">20</button>
        </span>
      </div>
    </div>

    <div class="codecol">
      <div class="codehead">
        <span class="syn">
          <span class="seg" id="langs"><button data-l="hs">Haskell</button><button data-l="elm">Elm</button></span>
          <span class="badge" id="badge" hidden>écrit à la main, pas dans elm/core</span>
        </span>
        <span class="syn" id="syn" hidden>
          <span class="lab">Syntaxe</span>
          <span class="seg" id="modes">
            <button data-m="bind">&gt;&gt;=</button><button data-m="do">do</button>
          </span>
        </span>
      </div>
      <pre class="code" id="code"></pre>
      <p class="note" id="note"></p>
    </div>
  </div>
</div>

<script>
(function () {
  const NS = "http://www.w3.org/2000/svg";
  const svg = document.getElementById("stage");
  const $ = (id) => document.getElementById(id);
  const reduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  function el(tag, attrs, parent, text) {
    const n = document.createElementNS(NS, tag);
    for (const k in attrs) n.setAttribute(k, attrs[k]);
    if (text != null) n.textContent = text;
    if (parent) parent.appendChild(n);
    return n;
  }
  const clear = () => { while (svg.firstChild) svg.removeChild(svg.firstChild); svg.dataset.scene = ""; };

  /* ---------- code panel ---------- */
  function esc(s) { return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
  function colorize(line) {
    const i = line.indexOf("--");
    let code = i >= 0 ? line.slice(0, i) : line;
    let cm = i >= 0 ? line.slice(i) : "";
    code = esc(code)
      .replace(/\b(do|where|instance|newtype|otherwise|if|then|else|case|of|let|in|type|alias)\b/g, '<span class="kw">$1</span>')
      .replace(/\b([A-Z][A-Za-z]*)\b/g, '<span class="ty">$1</span>');
    return code + (cm ? '<span class="cm">' + esc(cm) + "</span>" : "");
  }
  function setCode(lines, hl, skip) {
    hl = hl || []; skip = skip || [];
    $("code").innerHTML = lines.map((l, i) =>
      '<span class="ln' + (hl.includes(i) ? " hl" : "") + (skip.includes(i) ? " skip" : "") + '">' + colorize(l) + "</span>"
    ).join("");
  }

  let kind = "maybe", lang = "hs";
  /* ---------- nested boxes as trees, animated by key (FLIP) ---------- */
  const CX = 180, CY = 138;
  const B = (k, lab, ...kids) => ({ k, lab, kids });
  const P = (k, v, fail) => ({ k, v: String(v), fail: !!fail });

  function measure(n) {
    if (n.kids === undefined) { n.w = Math.max(34, n.v.length * 9.6 + 22); n.h = 32; return; }
    n.kids.forEach(measure);
    n.kw = n.kids.reduce((s, c) => s + c.w, 0) + Math.max(0, n.kids.length - 1) * 8;
    n.w = Math.max(n.lab.length * 7.4 + 22, n.kw + 20, 44);
    n.h = (n.kids.length ? Math.max(...n.kids.map((c) => c.h)) : 16) + 34;
  }
  function place(n, x, y, out) {
    n.x = x; n.y = y; out[n.k] = n;
    if (n.kids === undefined) return;
    let cx = x + (n.w - n.kw) / 2;
    n.kids.forEach((c) => { place(c, cx, y + 24 + (n.h - 34 - c.h) / 2, out); cx += c.w + 8; });
  }
  function layout(tree) {
    const t = JSON.parse(JSON.stringify(tree)), out = {}, order = [];
    measure(t); place(t, CX - t.w / 2, CY - t.h / 2, out);
    (function walk(n) { order.push(n); (n.kids || []).forEach(walk); })(t);
    return { map: out, order };
  }

  function drawNode(n, parent) {
    if (n.kids === undefined) {
      const g = el("g", { class: "anim" }, parent);
      el("rect", { x: n.x, y: n.y, width: n.w, height: n.h, rx: 16, class: "pill" + (n.fail ? " nothing" : "") }, g);
      el("text", { x: n.x + n.w / 2, y: n.y + n.h / 2 + 5.5, "text-anchor": "middle", class: "val" + (n.fail ? " nothing" : "") }, g, n.v);
      return { parts: [g], kind: "pill" };
    }
    const r = el("rect", { x: n.x, y: n.y, width: n.w, height: n.h, rx: 10, class: "layer anim", "vector-effect": "non-scaling-stroke" }, parent);
    r.style.transformBox = "view-box"; r.style.transformOrigin = "0 0";
    const t = el("text", { x: n.x + 10, y: n.y + 17, class: "layer-lab anim" }, parent, n.lab);
    return { parts: [r, t], kind: "box" };
  }

  function renderTree(tree, op, prevTree) {
    clear();
    if (op) el("text", { x: CX, y: 26, "text-anchor": "middle", class: "op fadein" }, svg, op);
    const to = layout(tree);
    const from = prevTree && !reduced ? layout(prevTree) : null;
    const g = el("g", {}, svg);
    const moves = [];
    to.order.forEach((n) => {
      const d = drawNode(n, g);
      const f = from && from.map[n.k];
      if (!from) return;
      if (!f || (f.kids === undefined) !== (n.kids === undefined)) {
        d.parts.forEach((p) => { p.style.transition = "none"; p.style.opacity = 0; moves.push([p, "fade"]); });
        return;
      }
      if (d.kind === "box") {
        const [r, t] = d.parts;
        r.style.transition = "none"; t.style.transition = "none";
        r.style.transform = `translate(${f.x}px, ${f.y}px) scale(${f.w / n.w}, ${f.h / n.h}) translate(${-n.x}px, ${-n.y}px)`;
        t.style.transform = `translate(${f.x - n.x}px, ${f.y - n.y}px)`;
        moves.push([r, "move"], [t, "move"]);
      } else {
        const p = d.parts[0];
        p.style.transition = "none";
        p.style.transform = `translate(${f.x + f.w / 2 - n.x - n.w / 2}px, ${f.y - n.y}px)`;
        moves.push([p, "move"]);
      }
    });
    if (from) {
      from.order.forEach((f) => {
        if (to.map[f.k] && (to.map[f.k].kids === undefined) === (f.kids === undefined)) return;
        const d = drawNode(f, g);
        d.parts.forEach((p) => moves.push([p, "ghost"]));
      });
      g.getBoundingClientRect();
      requestAnimationFrame(() => requestAnimationFrame(() => {
        moves.forEach(([p, how]) => {
          p.style.transition = "";
          if (how === "move") p.style.transform = "";
          else if (how === "fade") p.style.opacity = 1;
          else p.style.opacity = 0;
        });
      }));
    }
  }

  /* ---------- acts 1 & 2, one script per monad ---------- */
  const SA = "State · ";
  const ACT1 = {
    maybe: {
      note: "it désigne le résultat précédent dans ghci.",
      code: ["half :: Int -> Maybe Int", "half n | even n    = Just (n `div` 2)", "       | otherwise = Nothing", "",
        "fmap half (Just 8)", "  -- Just (Just 4)", "fmap (fmap half) it", "  -- Just (Just (Just 2))"],
      steps: [
        { type: "Maybe Int", tree: B("a", "Just", P("p", 8)), op: "", hl: [0, 1, 2],
          cap: "On part de <code>Just 8</code>. La fonction <code>half</code> divise par deux, mais échoue sur un nombre impair : elle renvoie une boîte <code>Maybe</code>." },
        { type: "Maybe (Maybe Int)", tree: B("a", "Just", B("b", "Just", P("p", 4))), op: "↓ fmap half", hl: [4, 5],
          cap: "<code>fmap</code> applique <code>half</code> à l'intérieur de la boîte. Comme <code>half</code> renvoie déjà une boîte, on obtient une boîte dans une boîte." },

  function railSteps() {
    const R = RR(), out = [], st = ["", "", ""];

    const c = (t) => `<code>${t.replace(/"/g, "&quot;")}</code>`;
    out.push({ x: 26, y: MAIN, text: R.ok(cur), fail: false, st: st.slice(), line: -1, bind: null, skip: [],

  function moveTo(p, x, y, instant) {
    if (instant) p.g.style.transition = "none";

      if (st.t) setLabel(p, st.t);
      p.g.classList.toggle("fail", !!st.fail);
      if (st.hide) {
        if (p.vis && fw) moveTo(p, st.x, st.y, false);
        p.g.style.opacity = 0; p.vis = false; continue;
      }
      if (!p.vis && fw && st.from) {
        moveTo(p, st.from[0], st.from[1], true);
        p.g.style.opacity = 0;
        requestAnimationFrame(() => requestAnimationFrame(() => { moveTo(p, st.x, st.y, false); p.g.style.opacity = 1; }));
      } else {
        moveTo(p, st.x, st.y, !fw);

      cap: "Un parseur est une fonction : il reçoit le reste de l'entrée, et renvoie peut-être une valeur avec ce qui reste à lire." }];
    out.push({ pieces: { p0: P0 }, used: 2, pipe: 0, def: [], inst: [1, 2, 4], edef: [], einst: [1],
      cap: "<code>nombre</code> lit les chiffres <code>12</code> et rend le reste, <code>\"" + pinput.slice(2) + "\"</code>. <code>&gt;&gt;=</code> passe 12 à la suite sous le nom <code>a</code>." });
    if (!ok) {
      const bad = { x: 180, y: ZY, t: elm ? "Err …" : "Nothing", fail: true, from: [g1, CY0 + 14] };
      out.push({ pieces: { p0: P0, res: bad }, used: 2, bad: 2, pipe: 1, def: [], inst: [1, 2, 3], edef: [], einst: [1],
        cap: "<code>symbole '+'</code> trouve un <code>-</code> : échec. Le parseur renvoie <code>Nothing</code>." });
      out.push({ pieces: { p0: P0, res: Object.assign({}, bad, { from: null }) }, used: 2, bad: 2, pipe: null, skip: [2, 3], def: [], inst: [3], edef: [], einst: [1],
        cap: "Les étapes suivantes ne sont jamais lancées : comme avec Maybe, le premier échec arrête tout. La position de l'échec, elle, est connue." });
      return out;
    }
    out.push({ pieces: { p0: P0, p1: P1 }, used: 3, pipe: 1, def: [], inst: [1, 2, 4], edef: [], einst: [1],
      cap: "<code>symbole '+'</code> consomme le <code>+</code>. Le reste à lire voyage d'une étape à l'autre, comme l'état dans State." });
    out.push({ pieces: { p0: P0, p1: P1, p2: P2 }, used: 5, pipe: 2, def: [], inst: [1, 2, 4], edef: [], einst: [1],
      cap: "<code>nombre</code> lit <code>30</code>. Il ne reste rien à lire." });
    out.push({ pieces: { p0: P0, p1: P1, p2: P2, res: { x: 180, y: ZY, t: elm ? "Ok 42" : "Just (42, \"\")" } }, used: 5, pipe: 3, def: [], inst: [], edef: [], einst: [],
      cap: "<code>pure (a + b)</code> produit 42 sans rien consommer. Résultat : <code>Just (42, \"\")</code>." });
    return out;
  }
  function applyParser(s) {
    svg.querySelectorAll("[data-cell]").forEach((g) => {
      const k = +g.dataset.cell;
      g.setAttribute("class", "cell" + (k === s.bad ? " bad" : k < s.used ? " used" : ""));
    });
    const c = svg.querySelector("#pcur");
    if (c) c.style.transform = `translate(${s.used * CW}px, 0px)`;
  }

  const KIND_ELM = {
    io: { type: "Task.andThen : (a -> Task x b) -> Task x a -> Task x b",
      note: "Task est l'IO d'Elm : une description d'effets que seul le runtime exécute, via Task.perform ou Task.attempt.",
      pipe: () => ["Task.succeed 3", "    |> Task.andThen attendre", "    |> Task.andThen attendre", "    |> Task.andThen attendre"],
      def: ["attendre : Int -> Task x Int", "attendre n =", "    Process.sleep 100", "        |> Task.map (\\_ -> n * 2)"],
      inst: ["-- Task.andThen, dans elm/core : primitif,", "-- le runtime exécute la première tâche", "-- puis donne son résultat à f"], defHl: [2, 3], instHl: [1, 2], finalHl: [1] },
    parser: { type: "andThen : (a -> Parser b) -> Parser a -> Parser b", off: 0,
      note: "En pratique, on écrit souvent succeed (+) |= int |. symbol \"+\" |= int : quand les étapes ne dépendent pas les unes des autres, map2 suffit. andThen sert quand la suite dépend de ce qu'on vient de lire.",
      pipe: () => ["int", "    |> andThen (\\a -> symbol \"+\"", "    |> andThen (\\_ -> int", "    |> andThen (\\b -> succeed (a + b))))"],
      def: ["-- int : Parser Int", "-- symbol : String -> Parser ()"],
      inst: ["-- andThen, dans elm/parser", "andThen : (a -> Parser b) -> Parser a -> Parser b"] },
    list: { type: "List.concatMap : (a -> List b) -> List a -> List b",
      note: "Si voisins renvoyait [], la branche disparaîtrait. List.concatMap aplatit à chaque étape, pas seulement à la fin.",
      pipe: () => ["[ 3 ]", "    |> List.concatMap voisins", "    |> List.concatMap voisins"],
      def: ["voisins : Int -> List Int", "voisins n = [ n - 1, n + 1 ]"],
      inst: ["-- List.concatMap, dans elm/core", "concatMap f xs = List.concat (List.map f xs)"], defHl: [1], instHl: [1], finalHl: [1] },
    reader: { type: "andThen : (a -> Reader env b) -> Reader env a -> Reader env b",
      note: "En Elm, on passe plutôt la configuration en argument. Mais le motif tient en une ligne.",
      pipe: () => ["always 3", "    |> andThen scale", "    |> andThen scale", "    |> andThen scale"],
      def: ["scale : Int -> Reader Int Int", "scale x = \\k -> x * k"],
      inst: ["andThen : (a -> Reader env b) -> Reader env a -> Reader env b", "andThen f m = \\env -> f (m env) env"], defHl: [1], instHl: [1], finalHl: [1] },
    writer: { type: "andThen : (a -> Writer b) -> Writer a -> Writer b",
      note: "Un tuple et ++ suffisent : chaque étape peut écrire dans le journal, aucune ne peut le lire.",
      pipe: () => ["( 8, [] )", "    |> andThen moitie", "    |> andThen moitie", "    |> andThen moitie"],
      def: ["moitie : Int -> Writer Int", "moitie n =", "    ( n // 2, [ String.fromInt n ++ \"÷2\" ] )"],
      inst: ["andThen : (a -> Writer b) -> Writer a -> Writer b", "andThen f ( a, log1 ) =", "    f a |> Tuple.mapSecond (\\log2 -> log1 ++ log2)"], defHl: [1, 2], instHl: [1, 2], finalHl: [2] },
    state: { type: "andThen : (a -> State s b) -> State s a -> State s b",
      note: "En Elm, l'état vit plutôt dans le Model de The Elm Architecture. Mais le motif tient en quelques lignes.",
      pipe: () => ["(\\s -> ( 3, s ))", "    |> andThen double", "    |> andThen double", "    |> andThen double"],
      def: ["double : Int -> State Int Int", "double x = \\s -> ( x * 2, s + 1 )"],
      inst: ["andThen : (a -> State s b) -> State s a -> State s b", "andThen f m s0 =", "    let", "        ( a, s1 ) = m s0", "    in", "    f a s1"], defHl: [1], instHl: [3, 5], finalHl: [1] }
  };
  const KK = () => (lang === "elm" ? KIND_ELM : KIND)[kind];

  const act3 = {
    get note() {
      if (lang === "elm") return isRail() ? `Même rail, écrit avec |> : chaque ${RR().op} est un aiguillage. Essaie 6 ou 20 pour voir l'échec.` : KK().note;
      return isRail() ? "Essaie 6 ou 20 pour voir l'échec au milieu du pipeline, puis bascule en notation do : le rail est le même." : KIND[kind].note;
    },
    get code() {
      if (!isRail()) { const K = KK(); return K.pipe().concat([""], K.def, [""], K.inst); }
      const R = RR();
      const arrow = lang === "elm" ? `    |> ${R.op} ` : "  >>= ";
      const pipe = M() === "bind"
        ? [R.ok(input), arrow + R.fn, arrow + R.fn, arrow + R.fn]
        : [`do a <- ${R.fn} ${input}`, `   b <- ${R.fn} a`, `   ${R.fn} b`];
      return pipe.concat([""], R.inst);
    },
    steps: [],
    prepare() { this.steps = isRail() ? railSteps() : kind === "io" ? ioSteps() : kind === "parser" ? parserSteps() : kind === "list" ? listSteps() : kind === "writer" ? writerSteps() : kind === "reader" ? readerSteps() : stateSteps(); },
    build() { isRail() ? buildRail() : kind === "io" ? buildIO() : kind === "parser" ? buildParser() : kind === "list" ? buildList() : kind === "writer" ? buildWriter() : kind === "reader" ? buildReader() : buildState(); },
    render(i, forward) {
      const s = this.steps[i];
      if (svg.dataset.scene !== kind) this.build();
      if (!isRail()) {
        applyPieces(s, forward);
        if (kind === "parser") applyParser(s);
        const K = KK(), pipeLen = K.pipe().length;
        const off = K.off !== undefined ? K.off : M() === "bind" ? 1 : (K.offDo || 0);
        const defStart = pipeLen + 1, instStart = defStart + K.def.length + 1;
        const hl = [];
        if (s.pipe === -1 && (M() === "bind" || K.offDo)) hl.push(0);
        if (s.pipe !== null && s.pipe >= 0) hl.push(s.pipe + off);
        let defs = s.def, insts = s.inst;
        if (lang === "elm") {
          if (s.einst) { defs = s.edef; insts = s.einst; }
          else { defs = s.def.length ? K.defHl : []; insts = s.inst.length ? (s.pipe === null ? K.finalHl : K.instHl) : []; }
        }
        defs.forEach((d) => hl.push(defStart + d));
        insts.forEach((d) => hl.push(instStart + d));
        return { type: K.type, hl, skip: (s.skip || []).map((j) => j + off), cap: fixCap(s.cap) };
      }
      setWagon(s.x, s.y, s.text, s.fail, !forward);
      stationEls.forEach((g, k) => { g.setAttribute("class", "station " + (s.st[k] || "")); });
      const off = M() === "bind" ? 1 : 0;
      const pipeLen = M() === "bind" ? 4 : 3;
      const hl = [];
      if (s.line === -1 && M() === "bind") hl.push(0);
      if (s.line !== null && s.line >= 0) hl.push(s.line + off);
      const R = RR();
      if (s.bind === "nothing") hl.push(pipeLen + 1 + R.nIdx);
      if (s.bind === "just") hl.push(pipeLen + 1 + R.jIdx);
      return { type: R.type, hl, skip: s.skip.map((j) => j + off), cap: s.cap };
    }
  };

  const acts = [act1, act2, act3];
  let actIdx = 0, step = 0, playing = false, timer = null, playTimer = null;

  function show(forward) {
    clearTimeout(timer);
    const a = acts[actIdx];
    const s = a.render(step, forward);
    $("typeline").innerHTML = '<span class="k">:: </span>' + esc(s.type).replace(/^\(&gt;&gt;=\) :: /, "(&gt;&gt;=) :: ");
    if (actIdx === 2) $("typeline").innerHTML = esc(s.type);
    else $("typeline").innerHTML = '<span class="k">type&nbsp;&nbsp;</span>' + esc(s.type);
    $("caption").innerHTML = s.cap;
    setCode(a.code, s.hl, s.skip);
    $("note").textContent = a.note;
    $("prev").disabled = step === 0;
    $("next").disabled = step === a.steps.length - 1;
    $("dots").innerHTML = a.steps.map((_, i) => '<span class="dot' + (i <= step ? " on" : "") + '"></span>').join("");
  }

  const TABDESC = [
    "<code>fmap</code> applique une fonction à l'intérieur de la boîte. Si cette fonction renvoie elle-même une boîte, les couches s'imbriquent.",
    "<code>join</code> fusionne deux couches du même contexte en une seule. Chaque monade le définit à sa façon.",
    "<code>&gt;&gt;=</code> fait <code>fmap</code> puis <code>join</code> à chaque étape : on enchaîne les calculs sans jamais imbriquer les couches. C'est l'équivalent générique du <code>andThen</code> d'Elm."
  ];
  function setAct(i) {
    $("tabdesc").innerHTML = TABDESC[i];
    stop();
    actIdx = i; step = 0;
    document.querySelectorAll(".tab").forEach((t) => t.setAttribute("aria-selected", String(+t.dataset.act === i)));
    $("opts").hidden = i !== 2;
    $("syn").hidden = i !== 2 || lang === "elm";
    if (i === 2) { acts[2].prepare(); acts[2].build(); }
    show(false);
  }

  function next() {
    const a = acts[actIdx];
    if (step < a.steps.length - 1) { step++; show(true); return true; }
    return false;
  }
  function prev() { if (step > 0) { step--; show(false); } }

  function stop() {
    playing = false; clearInterval(playTimer);
    $("play").textContent = "▶ Lecture";
  }
  function play() {
    const a = acts[actIdx];
    if (step === a.steps.length - 1) { step = 0; if (actIdx === 2) acts[2].build(); show(false); }
    playing = true; $("play").textContent = "❚❚ Pause";
    playTimer = setInterval(() => { if (!next()) stop(); }, 2200);
  }

  $("play").addEventListener("click", () => (playing ? stop() : play()));
  $("next").addEventListener("click", () => { stop(); next(); });
  $("prev").addEventListener("click", () => { stop(); prev(); });
  document.querySelectorAll(".tab").forEach((t) => t.addEventListener("click", () => setAct(+t.dataset.act)));

  const BLURB = {
    maybe: "Enchaîner des calculs qui peuvent échouer, sans tester l'échec à chaque étape.",
    either: "Comme <code>Maybe</code>, mais l'échec explique pourquoi : on garde le message d'erreur.",
    list: "Explorer plusieurs résultats possibles à la fois : chaque étape peut en produire zéro, un ou plusieurs. Les <code>voisins</code> d'un nombre sont celui d'avant et celui d'après.",
    reader: "Partager un environnement en lecture seule (une configuration, par exemple) sans le passer en argument partout.",
    writer: "Tenir un journal à côté du calcul : chaque étape y ajoute des lignes, que l'on récupère à la fin.",
    state: "Faire circuler un état modifiable d'étape en étape, sans le passer à la main.",
    io: "Décrire des effets (lire, afficher, attendre) sous forme de recette, que seul le runtime exécute, dans un ordre garanti.",
    parser: "Lire un texte morceau par morceau : chaque étape consomme le début de l'entrée, et peut échouer."
  };
  function syncSeg() {
    $("blurb").innerHTML = BLURB[kind];
    document.querySelectorAll("#inputs button").forEach((b) => b.setAttribute("aria-pressed", String(+b.dataset.v === input)));
    document.querySelectorAll("#modes button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.m === mode)));
    document.querySelectorAll("#kinds button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.k === kind)));
    document.querySelectorAll("#pinputs button").forEach((b) => b.addEventListener("click", () => {
    pinput = b.dataset.p; syncSeg(); stop(); step = 0; acts[2].prepare(); acts[2].build(); show(false);
  }));
  document.querySelectorAll("#langs button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.l === lang)));
    const badge = lang === "elm"
      ? (["reader", "writer", "state"].includes(kind) ? "écrit à la main, pas dans elm/core" : kind === "parser" ? "paquet elm/parser" : "")
      : (kind === "parser" ? "écrit à la main" : "");
    $("badge").textContent = badge; $("badge").hidden = !badge;
    $("pinputs").hidden = kind !== "parser";
    document.querySelectorAll("#pinputs button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.p === pinput)));
    $("syn").hidden = actIdx !== 2 || lang === "elm";
    $("inputs").hidden = !isRail();
    $("inputLab").hidden = !(isRail() || kind === "parser");
  }
  document.querySelectorAll("#inputs button").forEach((b) => b.addEventListener("click", () => {
    input = +b.dataset.v; syncSeg(); stop(); acts[2].prepare(); step = 0; acts[2].build(); show(false);
  }));
  document.querySelectorAll("#kinds button").forEach((b) => b.addEventListener("click", () => {
    kind = b.dataset.k; syncSeg(); stop(); step = 0;
    if (actIdx === 2) { acts[2].prepare(); acts[2].build(); }
    show(false);
  }));
  document.querySelectorAll("#langs button").forEach((b) => b.addEventListener("click", () => {
    lang = b.dataset.l; syncSeg(); stop(); step = 0;
    if (actIdx === 2) { acts[2].prepare(); acts[2].build(); }
    show(false);
  }));
  document.querySelectorAll("#modes button").forEach((b) => b.addEventListener("click", () => {
    mode = b.dataset.m; syncSeg(); show(false);
  }));

  syncSeg();
  setAct(0);
})();
</script>

</body>
</html>
